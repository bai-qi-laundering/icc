<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ICC 平燙機</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 antialiased font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const Icon = ({ name, size = 20, className = '' }) => {
      const icons = {
        Clock: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
        Save: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>,
        Trash2: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
        FileSpreadsheet: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></svg>,
        PlusCircle: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>,
        Edit: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
        X: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
        ImageIcon: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>,
        Loader2: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
        CalendarDays: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>,
        Cloud: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>,
        Settings: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
        CloudOff: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22.61 16.95A5 5 0 0 0 18 10h-1.26a8 8 0 0 0-7.05-6M5 5a8 8 0 0 0 4 15h9a5 5 0 0 0 1.7-.3"/><line x1="1" y1="1" x2="23" y2="23"/></svg>,
        RefreshCw: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>,
        PenTool: <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19 7-7 3 3-7 7-3-3z"/><path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="m2 2 7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      };
      return <div className={`inline-block ${className}`}>{icons[name]}</div>;
    };

    const getLocalISODate = (dateObj = new Date()) => {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };

    const formatDateForDisplay = (isoString) => {
      if (!isoString) return '';
      const parts = isoString.split('-');
      if (parts.length !== 3) return isoString;
      const month = parseInt(parts[1], 10);
      const day = parseInt(parts[2], 10);
      const dateObj = new Date(isoString);
      const dayOfWeek = ['日', '一', '二', '三', '四', '五', '六'][dateObj.getDay()];
      return `${month}/${day}(週${dayOfWeek})`;
    };

    const getCurrentTimeString = () => {
      const now = new Date();
      return `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
    };

    // ★ 新增簽名板元件
    const SignaturePad = ({ onSave, onCancel, initialSignature }) => {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        
        // 設定高解析度畫布以獲得平滑的線條
        const ctx = canvas.getContext('2d');
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        canvas.width = canvas.offsetWidth * ratio;
        canvas.height = canvas.offsetHeight * ratio;
        ctx.scale(ratio, ratio);
        
        // 預設白色背景 (如果不設定，存下來的圖預設背景是透明，截圖有時會怪怪的)
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 如果有初始簽名（例如在編輯模式），則載入並畫到畫布上
        if (initialSignature) {
           const img = new window.Image();
           img.onload = () => {
              ctx.drawImage(img, 0, 0, canvas.offsetWidth, canvas.offsetHeight);
           };
           img.src = initialSignature;
        }

        ctx.strokeStyle = '#0f172a'; // 深灰色筆跡
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
      }, [initialSignature]);

      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        
        let clientX = e.clientX;
        let clientY = e.clientY;
        
        if(e.touches && e.touches.length > 0) {
           clientX = e.touches[0].clientX;
           clientY = e.touches[0].clientY;
           e.preventDefault(); // 防止手機滾動
        }

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        ctx.beginPath();
        ctx.moveTo(x, y);
        setIsDrawing(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        
        let clientX = e.clientX;
        let clientY = e.clientY;

        if(e.touches && e.touches.length > 0) {
           clientX = e.touches[0].clientX;
           clientY = e.touches[0].clientY;
           e.preventDefault();
        }

        const x = clientX - rect.left;
        const y = clientY - rect.top;

        ctx.lineTo(x, y);
        ctx.stroke();
      };

      const stopDrawing = () => {
        setIsDrawing(false);
      };

      const handleClear = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };

      const handleSave = () => {
        const canvas = canvasRef.current;
        // 將圖片壓縮成品質較低的 JPEG，減少儲存空間 (0.5 代表 50% 品質)
        const dataUrl = canvas.toDataURL('image/jpeg', 0.5); 
        onSave(dataUrl);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 z-[60] flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col h-[60vh] max-h-[500px]">
             <div className="p-4 bg-slate-50 border-b flex justify-between items-center">
                <h3 className="font-bold text-slate-800 flex items-center gap-2">
                   <Icon name="PenTool" /> 員工簽名板 (可多人簽名)
                </h3>
                <button onClick={onCancel} className="text-slate-400 hover:text-slate-600">
                   <Icon name="X" size={24} />
                </button>
             </div>
             
             <div className="flex-1 bg-slate-200 relative p-2">
                <canvas 
                   ref={canvasRef}
                   className="w-full h-full bg-white rounded-lg shadow-inner cursor-crosshair touch-none"
                   onMouseDown={startDrawing}
                   onMouseMove={draw}
                   onMouseUp={stopDrawing}
                   onMouseLeave={stopDrawing}
                   onTouchStart={startDrawing}
                   onTouchMove={draw}
                   onTouchEnd={stopDrawing}
                />
                <div className="absolute top-4 left-4 text-slate-300 pointer-events-none text-xl font-bold opacity-30 select-none">
                   請在此處簽名
                </div>
             </div>
             
             <div className="p-4 flex gap-3 bg-white border-t">
                <button 
                  onClick={handleClear}
                  className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-lg hover:bg-slate-200 transition-colors"
                >
                  重簽 (清除)
                </button>
                <button 
                  onClick={handleSave}
                  className="flex-[2] py-3 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 transition-colors shadow-sm"
                >
                  完成簽名
                </button>
             </div>
          </div>
        </div>
      );
    };

    function App() {
      const tableRef = useRef(null);
      
      const [appConfig, setAppConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('machineAppConfig');
          return saved ? JSON.parse(saved) : { mode: 'local', apiUrl: '' };
        } catch (e) {
          return { mode: 'local', apiUrl: '' };
        }
      });
      
      const [showSettings, setShowSettings] = useState(false);
      const [tempUrl, setTempUrl] = useState(appConfig.apiUrl);

      const [records, setRecords] = useState([]);
      const [isLoading, setIsLoading] = useState(false);
      const [isSyncingBackground, setIsSyncingBackground] = useState(false);
      const [isGenerating, setIsGenerating] = useState(false);
      const [toastMessage, setToastMessage] = useState('');
      
      // ★ 新增：控制簽名板開關與編輯狀態
      const [showSignaturePad, setShowSignaturePad] = useState(false);

      const defaultForm = { date: getLocalISODate(), flatQty: '', pillowQty: '', onTime: '', offTime: '', signature: '' };
      const [formData, setFormData] = useState(defaultForm);
      const [editingId, setEditingId] = useState(null);

      const currentMonthPrefix = getLocalISODate().substring(0, 7);
      const currentDisplayMonth = new Date().getMonth() + 1;

      useEffect(() => {
        localStorage.setItem('machineAppConfig', JSON.stringify(appConfig));
        if (appConfig.mode === 'local') {
           loadLocalRecords();
        } else {
           fetchCloudRecords();
        }
      }, [appConfig]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(''), 3000);
      };

      const loadLocalRecords = () => {
        try {
          const saved = localStorage.getItem('machineRecords_local_v2'); // 改版號避免衝突
          if (saved) setRecords(JSON.parse(saved));
          else setRecords([]);
        } catch (e) {}
      };

      const saveLocalRecords = (newRecords) => {
        localStorage.setItem('machineRecords_local_v2', JSON.stringify(newRecords));
        setRecords(newRecords);
      };

      const fetchCloudRecords = async () => {
        if (!appConfig.apiUrl) return;
        setIsLoading(true);
        try {
          const response = await fetch(appConfig.apiUrl, { cache: 'no-store' });
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const textData = await response.text();
          let data;
          try {
             data = JSON.parse(textData);
          } catch (e) {
             throw new Error("伺服器回傳格式錯誤");
          }
          
          if (data.status === 'error') {
             showToast(`讀取錯誤: ${data.message}`);
             return;
          }

          setRecords(Array.isArray(data) ? data : []);
          showToast("已從試算表同步資料");
        } catch (error) {
          console.error("Fetch Error:", error);
          showToast(`連線失敗: ${error.message}`);
        } finally {
          setIsLoading(false);
        }
      };

      const sendToCloudBackground = async (action, payload) => {
        if (!appConfig.apiUrl) return;
        
        setIsSyncingBackground(true);
        
        try {
          const bodyData = JSON.stringify({ action: action, ...payload });
          const response = await fetch(appConfig.apiUrl, {
            method: 'POST',
            body: bodyData,
            redirect: 'follow'
          });

          if (!response.ok) {
             throw new Error(`HTTP error! status: ${response.status}`);
          }
          
          const textData = await response.text();
          let responseData;
          try {
             responseData = JSON.parse(textData);
          } catch(e) {
             throw new Error("回傳格式錯誤");
          }

          if (responseData.status !== 'success') {
             showToast(`雲端同步失敗: ${responseData.message}`);
          }

        } catch (error) {
          console.error("Post Error:", error);
          showToast(`傳輸失敗: ${error.message}`);
        } finally {
          setIsSyncingBackground(false);
        }
      };

      const handleInputChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const setTimeNow = (field) => {
        setFormData(prev => ({ ...prev, [field]: getCurrentTimeString() }));
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.date) {
          showToast("請選擇日期！");
          return;
        }

        const recordId = editingId || Date.now().toString();
        const recordToSave = { ...formData, id: recordId };
        
        if (editingId) {
          const updatedRecords = records.map(r => r.id === editingId ? recordToSave : r);
          setRecords(updatedRecords);
          setEditingId(null);
          showToast("紀錄已更新");
        } else {
          const updatedRecords = [...records, recordToSave];
          setRecords(updatedRecords);
          showToast("紀錄已新增");
        }
        
        setFormData({ ...defaultForm, date: getLocalISODate() });

        if (appConfig.mode === 'api') {
           const action = editingId ? 'update' : 'create';
           sendToCloudBackground(action, { record: recordToSave });
        } else {
           saveLocalRecords(editingId ? records.map(r => r.id === editingId ? recordToSave : r) : [...records, recordToSave]);
        }
      };

      const handleEdit = (record) => {
        // 相容舊資料格式，把 sign1 和 sign2 清掉避免報錯
        const { sign1, sign2, ...safeRecord } = record;
        setFormData(safeRecord);
        setEditingId(record.id);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleCancelEdit = () => {
        setFormData({ ...defaultForm, date: getLocalISODate() });
        setEditingId(null);
      };

      const handleDelete = async (id) => {
        if(window.confirm('確定要刪除這筆紀錄嗎？')) {
          setRecords(records.filter(record => record.id !== id));
          showToast("紀錄已刪除");
          
          if (appConfig.mode === 'api') {
            sendToCloudBackground('delete', { id: id });
          } else {
            saveLocalRecords(records.filter(record => record.id !== id));
          }
        }
      };
      
      const handleSaveSignature = (dataUrl) => {
         setFormData(prev => ({ ...prev, signature: dataUrl }));
         setShowSignaturePad(false);
      };

      const handleShareImage = async () => {
        if (sortedCurrentMonthRecords.length === 0) {
          showToast("當月沒有資料可以分享喔"); return;
        }
        if (!window.html2canvas) {
          showToast("截圖模組載入中，請稍候"); return;
        }
        if (!tableRef.current) return;

        setIsGenerating(true);
        showToast("正在產生完美表格截圖...");

        try {
          const canvas = await window.html2canvas(tableRef.current, {
            backgroundColor: "#ffffff",
            scale: 2, 
            useCORS: true,
            onclone: (clonedDocument) => {
              const outer = clonedDocument.querySelector('[data-screenshot-outer="true"]');
              const scroll = clonedDocument.querySelector('[data-screenshot-scroll="true"]');
              if (outer) { outer.style.width = 'max-content'; outer.style.minWidth = '100%'; }
              if (scroll) { scroll.style.overflow = 'visible'; }
            }
          });

          canvas.toBlob(async (blob) => {
            if (!blob) throw new Error("Canvas is empty");
            const fileName = `輪燙機_${currentDisplayMonth}月.png`;
            const file = new File([blob], fileName, { type: 'image/png' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({
                  files: [file],
                  title: `800-3 輪燙機紀錄表`,
                  text: `傳送 ${currentDisplayMonth}月份 紀錄表`
                });
                showToast("準備分享！");
              } catch (err) {}
            } else {
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = fileName;
              a.click();
              URL.revokeObjectURL(url);
              showToast("圖片已下載");
            }
            setIsGenerating(false);
          }, 'image/png');

        } catch (error) {
          console.error(error);
          showToast("產生圖片失敗，請重試");
          setIsGenerating(false);
        }
      };

      const sortedCurrentMonthRecords = records
        .filter(record => record.date && record.date.startsWith(currentMonthPrefix))
        .sort((a, b) => a.date.localeCompare(b.date));

      return (
        <div className="min-h-screen p-2 md:p-4 pb-20 relative">
          
          {/* Toast */}
          {toastMessage && (
            <div className="fixed top-4 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 transition-all">
              {(isLoading || isGenerating || isSyncingBackground) ? <Icon name="Loader2" className="animate-spin" size={18} /> : <Icon name="Save" size={18} />}
              {toastMessage}
            </div>
          )}

          {/* 簽名板 */}
          {showSignaturePad && (
             <SignaturePad 
                onCancel={() => setShowSignaturePad(false)} 
                onSave={handleSaveSignature}
                initialSignature={formData.signature}
             />
          )}

          {showSettings && (
            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6 relative">
                <h3 className="text-xl font-bold mb-4 flex items-center gap-2">
                  <Icon name="Cloud" size={24} className="text-blue-500" />
                  雲端試算表連線設定
                </h3>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Google Apps Script 網址 (URL)</label>
                    <input 
                      type="text" 
                      value={tempUrl}
                      onChange={(e) => setTempUrl(e.target.value)}
                      className="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm"
                      placeholder="https://script.google.com/macros/s/.../exec"
                    />
                  </div>
                  <div className="flex gap-2 pt-4">
                    <button 
                      onClick={() => {
                        setAppConfig({ mode: 'api', apiUrl: tempUrl });
                        setShowSettings(false);
                      }}
                      className="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700 transition-colors"
                    >
                      連線
                    </button>
                    <button 
                      onClick={() => {
                        setAppConfig({ mode: 'local', apiUrl: '' });
                        setShowSettings(false);
                      }}
                      className="flex-1 bg-slate-200 text-slate-700 font-bold py-2 rounded-lg hover:bg-slate-300 transition-colors"
                    >
                      使用本機
                    </button>
                  </div>
                </div>
                <button onClick={() => setShowSettings(false)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                  <Icon name="X" size={24} />
                </button>
              </div>
            </div>
          )}

          <div className="max-w-6xl mx-auto space-y-4 md:space-y-6">
            
            <header className="bg-white p-4 md:p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                <div className={`p-3 rounded-lg ${appConfig.mode === 'api' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-600'}`}>
                  <Icon name="FileSpreadsheet" size={32} />
                </div>
                <div>
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800">800-3 輪燙機日誌</h1>
                  <div className="flex items-center gap-2 mt-1">
                    {appConfig.mode === 'api' ? (
                      <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-bold bg-green-100 text-green-700">
                        <Icon name="Cloud" size={12} /> {isSyncingBackground ? '雲端背景同步中...' : '雲端連線中'}
                      </span>
                    ) : (
                      <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-bold bg-slate-100 text-slate-600">
                        <Icon name="CloudOff" size={12} /> 本機模式
                      </span>
                    )}
                  </div>
                </div>
              </div>
              
              <div className="flex flex-wrap gap-2">
                {appConfig.mode === 'api' && (
                   <button 
                     onClick={fetchCloudRecords}
                     disabled={isLoading || isSyncingBackground}
                     className="flex items-center justify-center gap-1 bg-blue-50 text-blue-600 px-3 py-2.5 rounded-lg font-bold hover:bg-blue-100 transition-all disabled:opacity-50"
                   >
                     <Icon name="RefreshCw" size={18} className={(isLoading || isSyncingBackground) ? 'animate-spin' : ''} />
                     同步
                   </button>
                )}
                <button 
                  onClick={() => setShowSettings(true)}
                  className="flex items-center justify-center gap-1 bg-slate-100 text-slate-700 px-3 py-2.5 rounded-lg font-bold hover:bg-slate-200 transition-all"
                >
                  <Icon name="Settings" size={18} /> 設定
                </button>
                <button 
                  onClick={handleShareImage}
                  disabled={isGenerating}
                  className="flex items-center justify-center gap-2 bg-[#06C755] text-white px-4 py-2.5 rounded-lg font-bold hover:bg-[#05b34c] shadow-md transition-all active:scale-95 disabled:opacity-70"
                >
                  {isGenerating ? <Icon name="Loader2" className="animate-spin" size={18} /> : <Icon name="ImageIcon" size={18} />}
                  分享報表
                </button>
              </div>
            </header>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6">
              
              <div className="lg:col-span-1 bg-white p-4 md:p-6 rounded-xl shadow-sm border border-slate-200 border-t-4 border-t-blue-500 relative">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-bold flex items-center gap-2 text-blue-800">
                    {editingId ? <Icon name="Edit" size={20} /> : <Icon name="PlusCircle" size={20} />}
                    {editingId ? '修改紀錄' : '新增紀錄'}
                  </h2>
                  {editingId && (
                    <button onClick={handleCancelEdit} className="text-slate-400 hover:text-slate-600 flex items-center gap-1 text-sm bg-slate-100 px-2 py-1 rounded">
                      <Icon name="X" size={14} /> 取消
                    </button>
                  )}
                </div>
                
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1 flex items-center gap-1">
                      <Icon name="CalendarDays" size={16} className="text-blue-500"/> 選擇日期
                    </label>
                    <input 
                      type="date" name="date" value={formData.date} onChange={handleInputChange}
                      className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-medium cursor-pointer"
                    />
                  </div>

                  <div className="p-3 bg-blue-50/50 rounded-lg space-y-3 border border-blue-100">
                    <div>
                      <label className="block text-sm font-medium text-blue-900 mb-1">開機時間</label>
                      <div className="flex gap-2">
                        <input type="time" name="onTime" value={formData.onTime} onChange={handleInputChange} className="flex-1 p-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                        <button type="button" onClick={() => setTimeNow('onTime')} className="px-3 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 shadow-sm flex items-center gap-1"><Icon name="Clock" size={16} /> 現在</button>
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-blue-900 mb-1">關機時間</label>
                      <div className="flex gap-2">
                        <input type="time" name="offTime" value={formData.offTime} onChange={handleInputChange} className="flex-1 p-2.5 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                        <button type="button" onClick={() => setTimeNow('offTime')} className="px-3 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 shadow-sm flex items-center gap-1"><Icon name="Clock" size={16} /> 現在</button>
                      </div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">平面數量</label>
                      <input type="text" name="flatQty" value={formData.flatQty} onChange={handleInputChange} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="數量" />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">枕套數量</label>
                      <input type="text" name="pillowQty" value={formData.pillowQty} onChange={handleInputChange} className="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="數量" />
                    </div>
                  </div>

                  {/* ★ 替換為手寫簽名按鈕區塊 */}
                  <div>
                     <label className="block text-sm font-medium text-slate-700 mb-2">撿套/放套簽名</label>
                     <div className="p-3 border-2 border-dashed border-slate-300 rounded-lg bg-slate-50 flex flex-col items-center justify-center gap-3">
                        {formData.signature ? (
                           <div className="relative w-full">
                              <img src={formData.signature} alt="員工簽名" className="w-full h-auto bg-white rounded shadow border border-slate-200 max-h-[120px] object-contain" />
                              <button 
                                 type="button"
                                 onClick={() => setShowSignaturePad(true)}
                                 className="absolute top-2 right-2 bg-slate-800/70 text-white p-1.5 rounded-md hover:bg-slate-800 backdrop-blur-sm transition-colors text-xs flex items-center gap-1"
                              >
                                 <Icon name="Edit" size={14} /> 重簽/補簽
                              </button>
                           </div>
                        ) : (
                           <button 
                             type="button" 
                             onClick={() => setShowSignaturePad(true)}
                             className="w-full py-4 bg-white border border-slate-300 rounded-lg text-slate-600 font-bold hover:bg-blue-50 hover:text-blue-600 hover:border-blue-300 transition-all flex flex-col items-center justify-center gap-1 shadow-sm"
                           >
                             <Icon name="PenTool" size={24} />
                             <span>點擊此處手寫簽名</span>
                             <span className="text-xs text-slate-400 font-normal">支援多人共同簽名</span>
                           </button>
                        )}
                     </div>
                  </div>

                  <button type="submit" className={`w-full mt-4 text-white font-bold p-3.5 rounded-lg shadow-sm transition-colors flex justify-center items-center gap-2 ${editingId ? 'bg-orange-500 hover:bg-orange-600' : 'bg-blue-600 hover:bg-blue-700'}`}>
                    <Icon name="Save" size={20} />
                    {editingId ? '更新紀錄' : (appConfig.mode === 'api' ? '極速儲存' : '儲存紀錄')}
                  </button>
                </form>
              </div>

              <div className="lg:col-span-2 relative">
                <div ref={tableRef} data-screenshot-outer="true" className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col w-full">
                  <div className="p-4 md:p-5 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-extrabold text-slate-800">
                        800-3 輪燙機 {currentDisplayMonth}月份紀錄
                      </h2>
                    </div>
                    <div className="text-sm px-3 py-1 bg-blue-100 text-blue-800 font-bold rounded-lg">
                      共 {sortedCurrentMonthRecords.length} 筆
                    </div>
                  </div>
                  
                  <div data-screenshot-scroll="true" className="overflow-x-auto flex-1 p-2 md:p-4 min-h-[300px]">
                    <table className="w-full text-base text-left min-w-[500px]">
                      <thead className="text-slate-500 border-b-2 border-slate-200">
                        <tr>
                          <th className="px-2 md:px-4 py-3 font-bold whitespace-nowrap text-slate-700 w-24">日期</th>
                          <th className="px-2 md:px-4 py-3 font-bold whitespace-nowrap text-slate-700 w-32">時間(開/關)</th>
                          <th className="px-2 md:px-4 py-3 font-bold whitespace-nowrap text-slate-700 w-32">數量(平/枕)</th>
                          <th className="px-2 md:px-4 py-3 font-bold whitespace-nowrap text-slate-700 min-w-[120px]">簽名(撿/放)</th>
                          <th data-html2canvas-ignore="true" className="px-2 md:px-4 py-3 font-bold whitespace-nowrap text-center text-slate-700 w-24">操作</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {sortedCurrentMonthRecords.map((record) => (
                          <tr key={record.id} className="hover:bg-slate-50 transition-colors">
                            <td className="px-2 md:px-4 py-4 whitespace-nowrap font-bold text-slate-800 text-lg">
                              {formatDateForDisplay(record.date)}
                            </td>
                            <td className="px-2 md:px-4 py-4 whitespace-nowrap">
                              <div className="text-blue-600 font-bold mb-1">開: {record.onTime || '--:--'}</div>
                              <div className="text-red-600 font-bold">關: {record.offTime || '--:--'}</div>
                            </td>
                            <td className="px-2 md:px-4 py-4 whitespace-nowrap">
                              <div className="text-slate-700 mb-1">平: <span className="font-bold">{record.flatQty || '0'}</span></div>
                              <div className="text-slate-700">枕: <span className="font-bold">{record.pillowQty || '0'}</span></div>
                            </td>
                            <td className="px-2 md:px-4 py-3">
                               {/* ★ 顯示簽名縮圖 */}
                               {record.signature ? (
                                  <div className="bg-white p-1 border border-slate-200 rounded w-full max-w-[120px]">
                                     <img src={record.signature} alt="簽名" className="w-full h-auto object-contain max-h-[40px]" />
                                  </div>
                               ) : (
                                  <span className="text-slate-400 text-sm italic">未簽名</span>
                               )}
                            </td>
                            <td data-html2canvas-ignore="true" className="px-2 md:px-4 py-4 whitespace-nowrap text-center">
                              <div className="flex justify-center gap-2">
                                <button onClick={() => handleEdit(record)} className="text-blue-500 hover:bg-blue-100 p-2 rounded transition-colors"><Icon name="Edit" size={20} /></button>
                                <button onClick={() => handleDelete(record.id)} className="text-slate-400 hover:text-red-500 hover:bg-red-50 p-2 rounded transition-colors"><Icon name="Trash2" size={20} /></button>
                              </div>
                            </td>
                          </tr>
                        ))}
                        {sortedCurrentMonthRecords.length === 0 && (
                          <tr>
                            <td colSpan="5" className="px-4 py-12 text-center text-slate-500 text-lg">
                              {appConfig.mode === 'api' ? '雲端資料庫目前尚無本月紀錄' : '本月目前還沒有紀錄資料'}
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                  <div className="px-4 py-2 text-right text-xs text-slate-300 font-medium bg-white">
                    {appConfig.mode === 'api' ? 'Synced with Google Sheets' : 'Generated by Digital Factory System'}
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
